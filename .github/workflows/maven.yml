# Helical Insight — CI / CD
#
# Push / PR  → Helical Insight tests + Instant BI tests (in parallel)
# Git tag    → above, then package Docker ZIP → GitHub Release
#
# Efficiency:
# - concurrency cancels superseded runs on the same ref
# - Maven / npm / pip caches
# - release job skips tests (already validated) and builds once

name: Build HelicalInsight

on:
  push:
    branches: ["master"]
    tags: ["v*", "*.*.*"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend-test:
    name: Helical Insight Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Prepare test environment
        run: bash scripts/setup-ci-test-env.sh

      - name: Test
        run: mvn -B -T 1C test --file server/pom.xml -Denv=ci -Dedition=hice
        env:
          MAVEN_OPTS: -Xmx2g

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: server/presentation/target/site/jacoco-aggregate/jacoco.csv
          badges-directory: .github/badges

  python-test:
    name: InstantBI Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: instantbi/src/com/helicalinsight/instantbi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            instantbi/src/com/helicalinsight/instantbi/requirements.txt
            instantbi/src/com/helicalinsight/instantbi/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Test
        run: |
          mkdir -p reports
          python -m pytest -m "not llm" \
            --cov=helicalbi \
            --cov=app \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:reports/coverage.xml
        env:
          HELICALBI_LLM_MODE: stub

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instantbi-coverage
          path: |
            instantbi/src/com/helicalinsight/instantbi/htmlcov/
            instantbi/src/com/helicalinsight/instantbi/reports/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Package and release (WAR + Docker ZIP)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [backend-test, python-test]
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        working-directory: client
        run: |
          npm ci --legacy-peer-deps
          npm run build18

      - name: Copy frontend into webapp
        run: bash scripts/copy-frontend-to-webapp.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Package WAR
        run: mvn -B -q clean package -DskipTests --file server/pom.xml -Dedition=hice -Denv=docker
        env:
          MAVEN_OPTS: -Xmx2g

      - name: Build Docker ZIP
        run: |
          # package-docker.sh expects WAR under presentation/target
          bash scripts/package-docker.sh "${{ steps.ver.outputs.version }}"
          # Fixed name for /releases/latest/download/helicalinsight-docker.zip
          cp -a "dist/helicalinsight-${{ steps.ver.outputs.version }}-docker.zip" \
            dist/helicalinsight-docker.zip

      - name: Upload build artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: helicalinsight-${{ steps.ver.outputs.version }}
          path: |
            dist/helicalinsight-docker.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Helical Insight ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/helicalinsight-docker.zip
