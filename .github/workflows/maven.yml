# Helical Insight — CI / CD
#
# Push / PR  → compile (Java matrix) → backend tests (Java matrix, if server/ changed)
#            → frontend tests (Node matrix, if client/ changed)
# Git tag    → above (always run both test suites), then package Docker ZIP → GitHub Release
#
# Tooling versions: .github/ci-tool-versions.env
#   JAVA_VERSIONS / NODE_VERSIONS                 — test matrices (e.g. "20 22")
#   JAVA_RELEASE_VERSION / NODE_RELEASE_VERSION   — packaging (must be in the matching list)
#
# Efficiency:
# - concurrency cancels superseded runs on the same ref
# - Maven / npm caches
# - path filters skip irrelevant test jobs
# - release job skips tests (already validated) and builds once

name: Build HelicalInsight

on:
  push:
    branches: ["master"]
    tags: ["v*", "*.*.*"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      java_versions: ${{ steps.tooling.outputs.java_versions }}
      java_release_version: ${{ steps.tooling.outputs.java_release_version }}
      java_distribution: ${{ steps.tooling.outputs.java_distribution }}
      node_versions: ${{ steps.tooling.outputs.node_versions }}
      node_release_version: ${{ steps.tooling.outputs.node_release_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - '.github/workflows/maven.yml'
              - '.github/ci-tool-versions.env'
              - 'scripts/resolve-ci-tool-versions.sh'
            server:
              - 'server/**'
              - 'scripts/setup-ci-test-env.sh'
              - 'scripts/resolve-ci-tool-versions.sh'
              - '.github/ci-tool-versions.env'
              - '.github/workflows/maven.yml'

      - name: Resolve tooling versions
        id: tooling
        run: bash scripts/resolve-ci-tool-versions.sh

  compile:
    name: Compile (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJson(needs.changes.outputs.java_versions) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ needs.changes.outputs.java_distribution }}
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Compile
        run: mvn -B -q clean compile --file server/pom.xml -Dedition=hice
        env:
          MAVEN_OPTS: -Xmx2g

  backend-test:
    name: Backend Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: [compile, changes]
    # Always run on tags so release validation is not skipped
    if: needs.changes.outputs.server == 'true' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJson(needs.changes.outputs.java_versions) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ needs.changes.outputs.java_distribution }}
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Prepare test environment
        run: bash scripts/setup-ci-test-env.sh

      - name: Test
        run: mvn -B -q test --file server/pom.xml -Denv=ci -Dedition=hice
        env:
          MAVEN_OPTS: -Xmx2g

      - name: Generate coverage badge
        if: matrix.java == needs.changes.outputs.java_release_version
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: server/presentation/target/site/jacoco-aggregate/jacoco.csv
          badges-directory: .github/badges

  frontend-test:
    name: Frontend Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: changes
    # Always run on tags so release validation is not skipped
    if: needs.changes.outputs.client == 'true' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJson(needs.changes.outputs.node_versions) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Test
        working-directory: client
        run: npm test
        env:
          CI: true

  release:
    name: Package and release (WAR + Docker ZIP)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [changes, backend-test, frontend-test]
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js ${{ needs.changes.outputs.node_release_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.changes.outputs.node_release_version }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        working-directory: client
        run: |
          npm ci --legacy-peer-deps
          npm run build18

      - name: Copy frontend into webapp
        run: bash scripts/copy-frontend-to-webapp.sh

      - name: Set up JDK ${{ needs.changes.outputs.java_release_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ needs.changes.outputs.java_release_version }}
          distribution: ${{ needs.changes.outputs.java_distribution }}
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Package WAR
        run: mvn -B -q clean package -DskipTests --file server/pom.xml -Dedition=hice -Denv=docker
        env:
          MAVEN_OPTS: -Xmx2g

      - name: Build Docker ZIP
        run: |
          # package-docker.sh expects WAR under presentation/target
          bash scripts/package-docker.sh "${{ steps.ver.outputs.version }}"
          # Fixed name for /releases/latest/download/helicalinsight-docker.zip
          cp -a "dist/helicalinsight-${{ steps.ver.outputs.version }}-docker.zip" \
            dist/helicalinsight-docker.zip

      - name: Upload build artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: helicalinsight-${{ steps.ver.outputs.version }}
          path: |
            dist/helicalinsight-docker.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Helical Insight ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/helicalinsight-docker.zip
