# Helical Insight — CI / CD
#
# Push / PR  → compile → backend tests
# Git tag    → above, then package WAR + Docker ZIP → GitHub Release
#
# Efficiency:
# - concurrency cancels superseded runs on the same ref
# - Maven / npm caches
# - release job skips tests (already validated) and builds once

name: Build HelicalInsight

on:
  push:
    branches: ["**"]
    tags: ["v*", "*.*.*"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Compile
        run: mvn -B -q clean compile --file server/pom.xml -Dedition=hice
        env:
          MAVEN_OPTS: -Xmx2g

  # backend-test:
  #   name: Backend Test
  #   runs-on: ubuntu-latest
  #   needs: compile
  #   timeout-minutes: 60
  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: Set up JDK 25
  #       uses: actions/setup-java@v4
  #       with:
  #         java-version: "25"
  #         distribution: temurin
  #         cache: maven
  #         cache-dependency-path: server/pom.xml

  #     - name: Prepare test environment
  #       run: bash scripts/setup-ci-test-env.sh

  #     - name: Test
  #       run: mvn -B -q test --file server/pom.xml -Denv=ci -Dedition=hice
  #       env:
  #         MAVEN_OPTS: -Xmx2g

  #     - name: Generate coverage badge
  #       uses: cicirello/jacoco-badge-generator@v2
  #       with:
  #         jacoco-csv-file: server/presentation/target/site/jacoco-aggregate/jacoco.csv
  #         badges-directory: .github/badges

  release:
    name: Package and release (WAR + Docker ZIP)
    # if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: backend-test
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        working-directory: client
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Copy frontend into webapp
        run: bash scripts/copy-frontend-to-webapp.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Package WAR
        run: mvn -B -q clean package -DskipTests --file server/pom.xml -Dedition=hice
        env:
          MAVEN_OPTS: -Xmx2g

      - name: Stage WAR artifact
        run: |
          mkdir -p dist
          WAR="$(ls -1 server/presentation/target/hi-ee-*.war | head -1)"
          cp -a "$WAR" "dist/hi-ee-${{ steps.ver.outputs.version }}.war"
          # Stable name for Docker package + compose context path
          cp -a "$WAR" dist/hi-ee.war
          ls -lh dist/

      - name: Build Docker ZIP
        run: |
          # package-docker.sh expects WAR under presentation/target
          bash scripts/package-docker.sh "${{ steps.ver.outputs.version }}"

      - name: Upload build artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: helicalinsight-${{ steps.ver.outputs.version }}
          path: |
            dist/hi-ee-${{ steps.ver.outputs.version }}.war
            dist/helicalinsight-${{ steps.ver.outputs.version }}-docker.zip
          if-no-files-found: error
          retention-days: 30

