# Committed Travle_Agent LLM test defaults.
# Secrets (session cookie, OpenAI API key) and environment-specific host
# (base_url) belong in llm_test_config.local.yaml (gitignored) or env vars —
# see llm_test_settings.py (HELICALBI_TEST_BASE_URL).

# base_url: https://your-hi-ee-host/hi-ee

model:
  dir: "0806"
  file: Travle_Agent.model

metadata:
  location: test
  metadataFileName: pg_sample_travel_data.metadata

default_provider: openai

providers:
  openai:
    model: gpt-4.1-mini
    temperature: 0.1
    max_tokens: 4000
    # Prefer HELICALBI_TEST_OPENAI_API_KEY / OPENAI_API_KEY or local yaml.
    api_key: ""
